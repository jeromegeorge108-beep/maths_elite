<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathÉlite · 1ʳᵉ préparatoire</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ff;--card:rgba(255,255,255,.75);--tx:#1e293b;--mu:#64748b;--bd:rgba(99,102,241,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.dark{--bg:#0b1020;--card:rgba(30,41,59,.65);--tx:#e2e8f0;--mu:#94a3b8;--bd:rgba(129,140,248,.28);color-scheme:dark}
body{font-family:Nunito,system-ui,sans-serif;background:radial-gradient(at 0% 0%,rgba(99,102,241,.25),transparent 45%),radial-gradient(at 100% 100%,rgba(16,185,129,.2),transparent 45%),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh}
h1,h2,h3,.f{font-family:'Baloo 2',Nunito,sans-serif}
.g{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:1.25rem;box-shadow:0 8px 30px rgba(79,70,229,.1)}
.mu{color:var(--mu)}
.b{padding:.65rem 1.1rem;border-radius:.9rem;font-weight:800;background:#4f46e5;color:#fff;transition:transform .15s,background .15s}
.b:hover{background:#4338ca;transform:translateY(-2px)}.b.e{background:#059669}.b.e:hover{background:#047857}
.o{display:block;width:100%;text-align:left;padding:.75rem 1rem;border-radius:.9rem;border:2px solid var(--bd);background:var(--card);font-weight:700;transition:.15s}
.o:hover:not(:disabled){border-color:#6366f1;transform:translateX(3px)}
.o.ok{background:#10b981;color:#fff;border-color:#10b981}.o.ko{background:#ef4444;color:#fff;border-color:#ef4444}
.tab{padding:.6rem .4rem;border-radius:.9rem;font-weight:800;font-size:.85rem;transition:.2s}
.tab.on{background:#4f46e5;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.4)}
input.t{width:100%;padding:.7rem 1rem;border-radius:.9rem;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700}
.ang{cursor:pointer}.ang circle{fill:#6366f1;transition:.15s}.ang:hover circle{fill:#10b981}.ang text{fill:#fff;font-weight:800;font-size:15px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<canvas id="cf" class="fixed inset-0 pointer-events-none z-50"></canvas>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden g px-5 py-3 font-bold"></div>
<div class="max-w-3xl mx-auto p-4 pb-16">
<header class="flex items-center justify-between mb-4">
<h1 class="text-2xl font-extrabold">➕ Math<span class="text-indigo-500">Élite</span> <span class="mu text-sm font-semibold">1ʳᵉ préparatoire</span></h1>
<button id="th" class="g w-11 h-11 text-xl" aria-label="Changer de thème">🌙</button>
</header>
<section id="dash" class="g p-4 mb-4"></section>
<nav class="grid grid-cols-4 gap-2 mb-4">
<button class="tab" data-t="c">📖 Cours</button><button class="tab" data-t="j">🎮 Mini-jeux</button><button class="tab" data-t="q">🧠 Quiz</button><button class="tab" data-t="f">✨ Formules</button>
</nav>
<main id="v"></main>
</div>
<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),sh=a=>a.sort(()=>Math.random()-.5);
const D={name:"Champion",xp:0,streak:0,last:"",lessons:[],quiz:{},badges:[],angles:0};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem("me")||"{}"))}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem("me",JSON.stringify(S))}catch(e){}};
(function(){const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t;save()}})();
/* theme */
let dark=false;try{const k=localStorage.getItem("dk");dark=k===null?matchMedia("(prefers-color-scheme:dark)").matches:k==="1"}catch(e){}
function theme(){document.documentElement.classList.toggle("dark",dark);$("#th").textContent=dark?"☀️":"🌙"}
$("#th").onclick=()=>{dark=!dark;try{localStorage.setItem("dk",dark?"1":"0")}catch(e){}theme()};theme();
/* sound + confetti */
let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=ok?"sine":"sawtooth";o.frequency.value=ok?740:170;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.25)}catch(e){}}
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:-Math.random()*13,c:["#6366f1","#10b981","#f59e0b","#ec4899"][R(4)],r:3+R(4)}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r*2,p.r)});if(++f<80)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.add("hidden"),2500)}
/* progress + badges */
const B={first:["🌱","Premier pas"],reader:["📚","Studieux (3 cours)"],blitz:["⚡","Éclair (100 pts au Blitz)"],hunter:["🎯","Chasseur d’angles"],quiz:["🧠","Quiz parfait"]};
function badge(id){if(!S.badges.includes(id)){S.badges.push(id);save();toast("🏅 Badge : "+B[id][1]);confetti()}}
function xp(n){S.xp+=n;save();dash()}
function dash(){const lv=Math.floor(S.xp/100)+1,pr=Math.round((S.lessons.length+Object.keys(S.quiz).length)/6*100);
$("#dash").innerHTML=`<div class="flex items-center gap-3"><div class="w-14 h-14 rounded-2xl bg-indigo-500 text-3xl flex items-center justify-center">🧑‍🎓</div>
<div class="flex-1 min-w-0"><input class="t !py-1 !px-2 !border-0 !bg-transparent f text-xl font-extrabold" value="${S.name}" maxlength="16" aria-label="Prénom" onchange="S.name=this.value||'Champion';save()">
<div class="mu text-sm">Niveau ${lv} · ${S.xp} XP</div></div>
<div class="text-center g px-3 py-1"><div class="text-2xl">🔥</div><div class="font-extrabold">${S.streak} j</div></div></div>
<div class="mt-3 text-sm font-bold flex justify-between"><span>Progression du programme</span><span>${pr}%</span></div>
<div class="h-3 rounded-full bg-slate-300/40 overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all" style="width:${pr}%"></div></div>
<div class="mt-3 flex gap-2 flex-wrap">${Object.keys(B).map(k=>`<span title="${B[k][1]}" class="text-2xl ${S.badges.includes(k)?"":"grayscale opacity-30"}">${B[k][0]}</span>`).join("")}</div>`}
/* nav */
let T="c";function go(t){T=t;clearInterval(bzI);document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({c:cours,j:jeux,q:quiz,f:formules})[t]();scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
/* COURS */
const L=[{ico:"🔢",t:"Nombres et opérations",ar:"الأعداد والعمليات",p:[
["Les entiers relatifs (الأعداد الصحيحة النسبية)","Un nombre relatif a un signe (+ ou −) et une distance à zéro. Plus un nombre négatif est loin de 0, plus il est petit : −8 &lt; −2 &lt; 0 &lt; 3.","الأعداد السالبة تكون أصغر كلما ابتعدت عن الصفر."],
["Addition et multiplication","Même signe : on additionne les distances et on garde le signe. Signes différents : on soustrait et on garde le signe du plus grand. Pour × et ÷ : (+)(+)=+, (−)(−)=+, (+)(−)=−.","Signs: same = positive, different = negative."],
["Les fractions (الكسور)","Pour additionner, on met au même dénominateur : a/b + c/b = (a+c)/b. Pour multiplier : (a/b)×(c/d) = (a×c)/(b×d).","وحّد المقامات قبل الجمع."]]},
{ico:"⚖️",t:"Algèbre",ar:"الجبر",p:[
["Équation ax + b = c","On isole x : on retire b des deux côtés, puis on divise par a. Donc x = (c − b) / a. Ex : 2x + 3 = 11 ⇒ 2x = 8 ⇒ x = 4.","Equation = balance: do the same on both sides."],
["Inéquations (المتباينات)","Même méthode qu’une équation, mais si on multiplie ou divise par un nombre négatif, le sens de l’inégalité change : −2x &gt; 6 ⇒ x &lt; −3.","اعكس اتجاه المتباينة عند الضرب في عدد سالب."],
["Puissances (القوى)","aᵐ × aⁿ = aᵐ⁺ⁿ ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ ; (aᵐ)ⁿ = aᵐˣⁿ ; a⁰ = 1.","Power = repeated multiplication: 2³ = 2×2×2 = 8."]]},
{ico:"📐",t:"Géométrie",ar:"الهندسة",p:[
["Parallèles et sécante (المستقيمات المتوازية)","Si (d)∥(d′) et une sécante les coupe : les angles correspondants sont égaux, les alternes-internes sont égaux, les co-internes sont supplémentaires (somme = 180°).","زوايا متناظرة = متساوية، متبادلة داخليًا = متساوية."],
["Le triangle (المثلث)","La somme des angles d’un triangle vaut 180°. Un triangle isocèle a deux côtés égaux et deux angles de base égaux.","مجموع زوايا المثلث = ١٨٠°."],
["Symétrie axiale et translation","Ces transformations conservent les longueurs, les angles et les aires : l’image d’une figure est superposable à la figure de départ.","الانعكاس والانسحاب يحافظان على الأطوال والزوايا."]]}];
function cours(){$("#v").innerHTML=L.map((c,i)=>`<details class="g p-4 mb-3" ${i==0?"open":""}><summary class="font-bold cursor-pointer text-lg">${c.ico} Chapitre ${i+1} : ${c.t} <span class="mu text-sm" dir="rtl">${c.ar}</span> ${S.lessons.includes(i)?"✅":""}</summary>
<div class="mt-3 space-y-4">${c.p.map(p=>`<div><h3 class="font-bold text-indigo-500">${p[0]}</h3><p>${p[1]}</p><p class="mu text-sm mt-1" dir="auto">💡 ${p[2]}</p></div>`).join("")}<button class="b e" onclick="done(${i})">J’ai compris ✓ (+20 XP)</button></div></details>`).join("")}
function done(i){if(!S.lessons.includes(i)){S.lessons.push(i);badge("first");if(S.lessons.length==3)badge("reader");beep(1);confetti();xp(20)}cours()}
/* JEUX */
let bzI,bz,H;
function jeux(){$("#v").innerHTML=`<div class="grid sm:grid-cols-2 gap-3 mb-3"><div class="g p-4"><h2 class="text-xl font-extrabold">⚡ Algebra Blitz</h2><p class="mu text-sm my-2">Résous ax + b = c. 60 secondes, +2 s par bonne réponse !</p><button class="b" onclick="blitz()">Jouer</button></div>
<div class="g p-4"><h2 class="text-xl font-extrabold">🎯 Angle Hunter</h2><p class="mu text-sm my-2">Clique sur le bon angle formé par deux parallèles et une sécante.</p><button class="b e" onclick="hunter()">Jouer</button></div></div><div id="gm"></div>`}
function blitz(){bz={s:0,t:60};clearInterval(bzI);nq();bzI=setInterval(()=>{bz.t--;const e=$("#bt");if(!e||bz.t<=0){clearInterval(bzI);if(e)endBz()}else e.textContent=bz.t},1000)}
function nq(){const a=2+R(8),x=1+R(10),b=(R(2)?1:-1)*(1+R(15)),c=a*x+b,s=new Set([x]);while(s.size<4)s.add(x+R(9)-4);bz.x=x;
$("#gm").innerHTML=`<div class="g p-4"><div class="flex justify-between font-extrabold mb-3"><span>⏱ <span id="bt">${bz.t}</span> s</span><span>⭐ ${bz.s}</span></div>
<p class="f text-3xl font-extrabold text-center mb-4">${a}x ${b<0?"−":"+"} ${Math.abs(b)} = ${c}</p><div class="grid grid-cols-2 gap-2">${sh([...s]).map(v=>`<button class="o text-center text-lg" onclick="bp(${v},this)">x = ${v}</button>`).join("")}</div></div>`}
function bp(v,el){if(v==bz.x){bz.s+=10;bz.t+=2;beep(1);nq()}else{beep(0);el.classList.add("ko");bz.t=Math.max(1,bz.t-3);setTimeout(()=>$("#gm")&&nq(),350)}}
function endBz(){beep(1);confetti();if(bz.s>=100)badge("blitz");xp(bz.s);$("#gm").innerHTML=`<div class="g p-6 text-center"><div class="text-5xl">🏁</div><h2 class="text-2xl font-extrabold my-2">${bz.s} points !</h2><p class="mu mb-3">+${bz.s} XP ajoutés. Atteins 100 pour le badge ⚡.</p><button class="b" onclick="blitz()">Rejouer</button></div>`}
const AT={cor:["correspondant",{1:5,2:6,3:7,4:8,5:1,6:2,7:3,8:4}],ai:["alterne-interne",{3:6,6:3,4:5,5:4}],ae:["alterne-externe",{1:8,8:1,2:7,7:2}],ci:["co-interne (supplémentaire)",{3:5,5:3,4:6,6:4}]};
function hunter(msg){const k=Object.keys(AT)[R(4)],ks=Object.keys(AT[k][1]),n=+ks[R(ks.length)];H={a:AT[k][1][n],n,k};
const O=[[-42,-16],[34,-26],[-34,28],[46,20]],A=[160,90],Bp=[240,210];
const an=(i)=>{const p=i<5?A:Bp,o=O[(i-1)%4];return `<g class="ang" onclick="hp(${i})" role="button" aria-label="Angle ${i}"><circle cx="${p[0]+o[0]}" cy="${p[1]+o[1]}" r="14"/><text x="${p[0]+o[0]}" y="${p[1]+o[1]+5}" text-anchor="middle">${i}</text></g>`};
$("#gm").innerHTML=`<div class="g p-4"><p class="font-extrabold text-center mb-2" id="hq">Trouve l’angle <span class="text-emerald-500">${AT[k][0]}</span> de l’angle <span class="text-indigo-500 text-xl">${n}</span></p>
<svg viewBox="0 0 400 270" class="w-full max-w-md mx-auto"><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="10" y1="90" x2="390" y2="90"/><line x1="10" y1="210" x2="390" y2="210"/><line x1="120" y1="30" x2="280" y2="270" stroke="#f59e0b"/></g>
<text x="14" y="80" fill="currentColor" font-size="13">(d)</text><text x="14" y="200" fill="currentColor" font-size="13">(d′)  (d)∥(d′)</text>${[1,2,3,4,5,6,7,8].map(an).join("")}</svg>
<p id="hf" class="text-center font-bold h-6">${msg||"&nbsp;"}</p><p class="mu text-center text-sm">Réussis : ${S.angles} · 5 réussites = badge 🎯</p></div>`}
function hp(i){if(i==H.a){beep(1);confetti();S.angles++;if(S.angles>=5)badge("hunter");xp(10);hunter("✅ Bravo ! +10 XP")}else{beep(0);$("#hf").innerHTML="❌ Non, l’angle "+i+" n’est pas "+AT[H.k][0]+" à "+H.n+". Réessaie !"}}
/* QUIZ */
const Q=[{t:"Nombres",ico:"🔢",q:[
{q:"(−3) + (−7) = ?",o:["−10","10","−4","4"],a:0,e:"Même signe : 3 + 7 = 10, on garde le signe −."},
{q:"(−4) × (+6) = ?",o:["24","−24","−2","2"],a:1,e:"Signes différents ⇒ le produit est négatif."},
{q:"Complète : 3/4 + 1/4 = …",f:"1",e:"Même dénominateur : (3+1)/4 = 4/4 = 1."},
{q:"Quel est le plus petit nombre ?",o:["−8","−2","0","3"],a:0,e:"Parmi les négatifs, le plus éloigné de 0 est le plus petit."}]},
{t:"Algèbre",ico:"⚖️",q:[
{q:"Résous 2x + 3 = 11.",o:["x = 4","x = 7","x = 5","x = 14"],a:0,e:"2x = 11 − 3 = 8, donc x = 8 ÷ 2 = 4."},
{q:"2³ × 2⁴ = ?",o:["2⁷","2¹²","4⁷","2¹"],a:0,e:"On additionne les exposants : 3 + 4 = 7."},
{q:"Complète : si 3x − 5 = 10, alors x = …",f:"5",e:"3x = 15 donc x = 5."},
{q:"x + 4 &gt; 9 équivaut à :",o:["x &gt; 5","x &lt; 5","x &gt; 13","x &lt; 13"],a:0,e:"On retire 4 des deux côtés : x &gt; 5."}]},
{t:"Géométrie",ico:"📐",q:[
{q:"La somme des angles d’un triangle vaut :",o:["90°","180°","360°","120°"],a:1,e:"Propriété fondamentale : 180°."},
{q:"Deux parallèles coupées par une sécante : les angles alternes-internes sont :",o:["égaux","supplémentaires","complémentaires","nuls"],a:0,e:"Alternes-internes ⇒ égaux (comme les correspondants)."},
{q:"Complète : triangle isocèle, angle au sommet 40°. Chaque angle de base mesure … °",f:"70",e:"(180 − 40) ÷ 2 = 70°."},
{q:"Dans ABC, Â = 50° et B̂ = 60°. Que vaut Ĉ ?",o:["70°","80°","60°","90°"],a:0,e:"Ĉ = 180 − (50 + 60) = 70°. Rédige : « La somme des angles vaut 180°, donc… »."}]}];
let qz;
function quiz(){$("#v").innerHTML=`<div class="grid gap-3">${Q.map((c,i)=>`<button class="g p-4 text-left flex items-center gap-3" onclick="qs(${i})"><span class="text-3xl">${c.ico}</span><span class="flex-1"><b class="text-lg">Quiz : ${c.t}</b><br><span class="mu text-sm">4 questions · QCM et à compléter</span></span><span class="font-extrabold">${S.quiz[i]!=null?"🏆 "+S.quiz[i]+"/4":""}</span></button>`).join("")}</div>`}
function qs(c){qz={c,i:0,s:0};qr()}
function qr(){const q=Q[qz.c].q[qz.i];qz.d=0;$("#v").innerHTML=`<div class="g p-4"><div class="mu text-sm font-bold mb-1">${Q[qz.c].t} · Question ${qz.i+1}/4</div><div class="h-2 rounded-full bg-slate-300/40 mb-3"><div class="h-full rounded-full bg-emerald-500" style="width:${qz.i*25}%"></div></div>
<p class="font-extrabold text-lg mb-3">${q.q}</p>${q.o?`<div class="grid gap-2">${q.o.map((o,i)=>`<button class="o" onclick="qa(${i})">${o}</button>`).join("")}</div>`:`<div class="flex gap-2"><input id="fi" class="t" inputmode="decimal" placeholder="Ta réponse"><button class="b" onclick="qf()">Valider</button></div>`}<div id="fb" class="mt-3"></div></div>`}
function qa(i){if(qz.d)return;const q=Q[qz.c].q[qz.i];document.querySelectorAll(".o").forEach((b,j)=>{b.disabled=1;if(j==q.a)b.classList.add("ok");else if(j==i)b.classList.add("ko")});fin(i==q.a,q)}
function qf(){if(qz.d)return;const q=Q[qz.c].q[qz.i];fin($("#fi").value.replace(/[\s°]/g,"").replace(",",".")==q.f,q)}
function fin(ok,q){qz.d=1;if(ok){qz.s++;beep(1);confetti();xp(10)}else beep(0);
$("#fb").innerHTML=`<div class="p-3 rounded-xl ${ok?"bg-emerald-500/20":"bg-rose-500/20"}"><b>${ok?"✅ Bonne réponse !":"❌ Pas tout à fait."}</b><p class="text-sm mt-1">${q.e}</p></div><button class="b mt-3" onclick="qn()">${qz.i==3?"Voir mon score":"Question suivante"}</button>`}
function qn(){if(++qz.i<4)return qr();if(S.quiz[qz.c]==null||qz.s>S.quiz[qz.c])S.quiz[qz.c]=qz.s;if(qz.s==4)badge("quiz");save();dash();const m=["Relis le cours, tu vas y arriver ! 💪","Bon début, continue !","Très bien !","Presque parfait !","Parfait, tu es prêt(e) pour l’examen ! 🏆"][qz.s];
$("#v").innerHTML=`<div class="g p-6 text-center"><div class="text-5xl">${qz.s>=3?"🎉":"📚"}</div><h2 class="text-3xl font-extrabold my-2">${qz.s} / 4</h2><p class="mu mb-4">${m}</p><button class="b" onclick="qs(${qz.c})">Recommencer</button> <button class="b e" onclick="go('q')">Autres quiz</button></div>`}
/* FORMULES */
function formules(){const F=[["Équation","x = (c − b) ÷ a","Fais la même opération des deux côtés."],["Somme des angles d’un triangle","Â + B̂ + Ĉ = 180°","Utilise-la pour trouver un angle manquant."],["Produit de puissances","aᵐ × aⁿ = aᵐ⁺ⁿ","Même base : on additionne les exposants."],["Quotient de puissances","aᵐ ÷ aⁿ = aᵐ⁻ⁿ","Même base : on soustrait les exposants."],["Règle des signes","(−)×(−) = +  ;  (+)×(−) = −","Nombre de signes − pair ⇒ résultat positif."],["Angles et parallèles","correspondants = ; alternes-internes = ; co-internes = 180°","Dessine toujours la sécante en couleur."],["Triangle isocèle","angle de base = (180° − sommet) ÷ 2","Deux côtés égaux ⇒ deux angles égaux."],["Rédaction d’une preuve","Données → Propriété → Conclusion","« On sait que… or… donc… »"]];
$("#v").innerHTML=`<div class="grid sm:grid-cols-2 gap-3">${F.map(f=>`<div class="g p-4"><h3 class="font-bold text-indigo-500">${f[0]}</h3><p class="f text-xl font-extrabold my-1">${f[1]}</p><p class="mu text-sm">💡 ${f[2]}</p></div>`).join("")}</div>`}
dash();go("c");
</script></body></html>
